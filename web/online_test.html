<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Toxic Farm — Online Test</title>
<style>
body{margin:0;background:#17201d;color:#f3ead8;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
main{width:min(720px,92vw);background:#26342e;border:2px solid #5d7c62;border-radius:16px;padding:24px;box-sizing:border-box}
h1{margin-top:0}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:10px;border-radius:8px;border:0}button{cursor:pointer}
#status{margin:16px 0;font-weight:700}#log{height:260px;overflow:auto;background:#101614;padding:12px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body><main>
<h1>🌱 The Toxic Farm — Online</h1>
<p>Teste rápido da camada WebSocket. A build Godot Web usa o mesmo protocolo.</p>
<div class="row">
<input id="url" value="ws://localhost:8080" size="28">
<input id="name" value="Jogador" maxlength="24">
<button id="connect">Conectar</button>
<button id="ping">Ping/ação</button>
</div>
<div id="status">Desconectado</div>
<pre id="log"></pre>
<script>
let ws;
const log = x => document.querySelector("#log").textContent += x + "\n";
document.querySelector("#connect").onclick = () => {
  ws = new WebSocket(document.querySelector("#url").value);
  ws.onopen = () => {
    document.querySelector("#status").textContent = "🟢 Conectado";
    ws.send(JSON.stringify({type:"join",name:document.querySelector("#name").value,character:"Pepitão",element:"Spiritual"}));
    log("> conectado");
  };
  ws.onmessage = e => log("< " + e.data);
  ws.onclose = () => document.querySelector("#status").textContent = "🔴 Desconectado";
  ws.onerror = () => log("Erro de conexão");
};
document.querySelector("#ping").onclick = () => ws?.send(JSON.stringify({type:"action",action:"ping"}));
</script>
</main></body>
</html>
