name: The Toxic Farm - Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Export Godot Web
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.5.2&flavor=stable&slug=linux.x86_64.zip&platform=linux.x86_64
          godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.5.2&flavor=stable&slug=export_templates.tpz&platform=templates
          relative_project_path: ./
          use_preset_export_path: true
          presets_to_export: Web
          cache: true

      - name: Verify Web export
        run: |
          test -f web/index.html
          test -s web/index.html
          touch web/.nojekyll
          echo "Web export verified: web/index.html"
          find web -maxdepth 2 -type f | sort | head -100

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
